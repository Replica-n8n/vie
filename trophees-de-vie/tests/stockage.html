<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Essai du stockage</title>
<body>
<script type="module">
// Essai du stockage dans un vrai navigateur (IndexedDB n'existe pas dans Node).
// Lancé par tools/essai-stockage.mjs, qui lit window.resultat.
import { ouvrir, effacer, idUnique, BASE } from '../js/stockage.js';
import { CATALOGUE } from '../js/config/vie.js';
import { comptes, lire } from '../js/coeur.js';
import { MOMENTS, NAISSANCE } from './exemple.js';

const controles = [];
const verifier = (nom, ok, detail = '') => controles.push({ nom, ok: Boolean(ok), detail: String(detail) });

try {
  const A = 'essai-a', B = 'essai-b';
  await effacer(A); await effacer(B);

  // Une horloge qu'on avance à la main, pour décider de qui est le plus récent.
  let heure = 0;
  const maintenant = () => new Date(Date.UTC(2026, 9, 3, 12, 0, heure++)).toISOString();

  const a = await ouvrir(A, { maintenant });
  verifier('un auteur est tiré au premier lancement', a.auteur && a.auteur.length >= 32, a.auteur);

  const t = await a.ecrire('moments', { reussite: 'permis', titre: 'Permis', niveau: 'bronze', annee: 2010, date: null });
  verifier('un moment reçoit un identifiant, deux dates et un auteur', t.id && t.creeLe && t.modifieLe && t.auteur === a.auteur, JSON.stringify(t));
  verifier('deux identifiants ne se ressemblent pas', idUnique() !== idUnique());

  const modifie = await a.ecrire('moments', { ...t, niveau: 'argent' });
  verifier('modifier garde la date de création et avance celle de modification', modifie.creeLe === t.creeLe && modifie.modifieLe > t.modifieLe);
  verifier('modifier ne crée pas de doublon', (await a.tout('moments')).length === 1);

  await a.retirer('moments', t.id);
  verifier('retirer cache le moment', (await a.tout('moments')).length === 0);
  const marque = (await a.tout('moments', { avecSupprimes: true }))[0];
  verifier('retirer laisse une marque au lieu d’effacer', marque && marque.supprimeLe, JSON.stringify(marque));
  await a.remettre('moments', t.id);
  verifier('remettre annule la suppression', (await a.tout('moments')).length === 1);

  await a.ecrire('points', { mois: '2026-09', roue: { sante: 7 }, meteo: 4, satisfaction: 2, sens: 1, energie: 1 });
  await a.ecrire('points', { mois: '2026-09', roue: { sante: 8 }, meteo: 5, satisfaction: 2, sens: 1, energie: 1 });
  const points = await a.tout('points');
  verifier('refaire le point du même mois le remplace', points.length === 1 && points[0].meteo === 5, JSON.stringify(points));

  await a.regler('prenom', 'Léa');
  verifier('un réglage se relit', (await a.reglage('prenom')) === 'Léa');
  verifier('un réglage absent rend sa valeur par défaut', (await a.reglage('inconnu', 42)) === 42);

  const photo = await a.ecrire('photos', { donnees: new Blob(['image fictive'], { type: 'image/jpeg' }), type: 'image/jpeg' });
  const sauvegarde = JSON.parse(JSON.stringify(await a.exporter()));
  verifier('la sauvegarde passe par du texte, photo comprise', typeof sauvegarde.magasins.photos[0].donnees === 'string' && sauvegarde.format === 'trophees-de-vie');

  // Reprise sur un autre appareil
  const b = await ouvrir(B, { maintenant });
  const ecrits = await b.importer(sauvegarde);
  verifier('la sauvegarde se reprend sur un appareil vide', ecrits > 0 && (await b.tout('moments'))[0].niveau === 'argent', ecrits);
  const reprise = await b.lire('photos', photo.id);
  verifier('la photo revient entière', reprise && (await reprise.donnees.text()) === 'image fictive' && reprise.donnees.type === 'image/jpeg');
  verifier('l’identité de l’appareil ne s’importe pas', b.auteur !== a.auteur && (await b.reglage('auteur')) === b.auteur);
  verifier('importer deux fois n’écrit rien de plus', (await b.importer(sauvegarde)) === 0);

  // Le plus récent gagne, dans les deux sens
  await b.ecrire('moments', { ...(await b.tout('moments'))[0], niveau: 'or' });
  await b.importer(sauvegarde);
  verifier('une sauvegarde ancienne n’écrase pas une modification plus récente', (await b.tout('moments'))[0].niveau === 'or');
  await a.importer(JSON.parse(JSON.stringify(await b.exporter())));
  verifier('une sauvegarde récente remplace l’ancienne version', (await a.tout('moments'))[0].niveau === 'or');

  let refus = '';
  try { await b.importer({ format: 'autre' }); } catch (e) { refus = e.message; }
  verifier('un fichier étranger est refusé avec une phrase claire', refus.includes('sauvegarde de Trophées de vie'), refus);
  refus = '';
  try { await b.importer({ format: 'trophees-de-vie', schema: 99, magasins: {} }); } catch (e) { refus = e.message; }
  verifier('une sauvegarde d’une version future est refusée', refus.includes('plus récente'), refus);

  // Une vie entière passe par la base sans rien perdre
  const c = await ouvrir('essai-c', { maintenant });
  for (const m of MOMENTS) await c.ecrire('moments', m);
  verifier('une vie entière se relit avec les mêmes comptes', JSON.stringify(comptes(lire(await c.tout('moments'), CATALOGUE, NAISSANCE))) === '{"total":21,"or":5,"argent":8,"bronze":8}');
  verifier('les essais ne touchent pas à la vraie base', !(await indexedDB.databases()).some((x) => x.name === BASE));
  c.fermer(); await effacer('essai-c');

  // Ce qui est écrit survit à la fermeture
  a.fermer();
  const a2 = await ouvrir(A, { maintenant });
  verifier('les données survivent à la fermeture, l’auteur aussi', (await a2.tout('moments')).length === 1 && a2.auteur === a.auteur);

  a2.fermer(); b.fermer();
  await effacer(A); await effacer(B);
} catch (erreur) {
  verifier('aucune erreur inattendue', false, erreur.stack || erreur);
}
window.resultat = controles;
</script>
</body>
</html>
