<title>Trophées de vie, directions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=swap">
<style>
/* Planche de comparaison : trois téléphones côte à côte, même contenu, trois partis pris. */
:root{ --pg:#ECECF0; --pg-ink:#17171C; --pg-muted:#55555F;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif; --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --pg:#141418; --pg-ink:#F0F0F4; --pg-muted:#B0B0BC; color-scheme:dark } }
:root[data-theme="dark"]{ --pg:#141418; --pg-ink:#F0F0F4; --pg-muted:#B0B0BC; color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--pg);color:var(--pg-ink);font:16px/1.4 var(--body)}
.wrap{max-width:1620px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
h1{font:800 34px/1 var(--display);font-stretch:75%;margin:0 0 6px}
.intro{color:var(--pg-muted);margin:0 0 28px;max-width:60ch}
.board{display:flex;flex-wrap:wrap;gap:36px 28px;justify-content:center}
.col{width:360px;max-width:100%}
.col h2{font:700 22px/1.1 var(--display);margin:0 0 4px}
.col p.why{color:var(--pg-muted);font-size:15px;margin:0 0 14px;min-height:3.9em}
p,h3,ul{margin:0}

/* Le téléphone */
.ph{width:100%;height:836px;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 22px 50px rgba(0,0,0,.28)}
.scr{height:100%;padding:24px 16px 110px;display:flex;flex-direction:column;gap:12px}
.date{font-size:14px}
.hi{font:800 46px/.92 var(--display);font-stretch:75%}
.sv{display:flex;gap:12px;padding:18px;align-items:flex-start}
.sv .k{font-size:14px}
.sv .t{font:700 21px/1.15 var(--display);text-wrap:balance}
.sv .q{font-style:italic;font-size:15px;margin-top:4px}
.vt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px}
.tile b{font:800 40px/1 var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:14px}
.cv,.rb{padding:16px}
.lab{font:700 14px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
.cvin{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:center}
.cvin svg{width:100%;display:block;overflow:visible}
.rg{fill:none;stroke:currentColor;stroke-opacity:.28}
.rp{fill:none;stroke:currentColor;stroke-opacity:.7;stroke-dasharray:4 4;stroke-width:1.5}
.rn{fill:currentColor;fill-opacity:.22;stroke:currentColor;stroke-width:2.5;stroke-linejoin:round}
.st{list-style:none;padding:0;display:grid;gap:7px}
.st li{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:2px 8px;align-items:baseline;font-size:15px}
.st b{font:800 24px/1 var(--display);font-stretch:75%}
.st em{font-style:normal;font-size:14px;text-align:right}
.st u{display:none}
.yrs{display:flex;justify-content:space-between}
.yc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:70px}
.yc .l{font:700 14px/1 var(--display);margin-top:4px}
.bar{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;padding:8px;border-radius:40px}
.bar span{flex:1;height:60px;border-radius:30px;display:grid;place-items:center;font-weight:700}

/* Médailles : une forme par métal */
.med{flex:none;width:36px;height:36px;display:block}
.med.b{border-radius:50%;background:radial-gradient(circle at 34% 28%,#F3C39B,#C97F4B 45%,#96552A)}
.med.a{clip-path:polygon(50% 0,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);background:radial-gradient(circle at 34% 28%,#F2F5FA,#B5BECB 45%,#7C8696)}
.med.o{clip-path:polygon(50% 0,64.9% 14%,85.4% 14.6%,86% 35.1%,100% 50%,86% 64.9%,85.4% 85.4%,64.9% 86%,50% 100%,35.1% 86%,14.6% 85.4%,14% 64.9%,0 50%,14% 35.1%,14.6% 14.6%,35.1% 14%);background:radial-gradient(circle at 34% 28%,#FFE99A,#E3B02C 45%,#B37F08)}
.med.p{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:radial-gradient(circle at 40% 30%,#EAFBFF,#8ACDE2 45%,#3F8FAA)}
.med.c{border-radius:50%;border:2px solid currentColor}
.med.big{width:56px;height:56px}
.med.dot{width:15px;height:15px}
.gl{display:block}

/* A · Expressif : des aplats francs, des formes qui varient, des chiffres énormes */
.ex{background:#F1EAFF;color:#1B1035}
.ex .date{color:#4A3F6B}
.ex .sv{background:#5B3DF5;color:#FFFFFF;border-radius:40px 40px 40px 10px}
.ex .sv .k{color:#DCD4FF}
.ex .tile{color:#1B1035}
.ex .tile:nth-child(odd){border-radius:44px 44px 14px 14px}
.ex .tile:nth-child(even){border-radius:14px 14px 44px 44px}
.ex .tile.b{background:#FFD3BA}.ex .tile.a{background:#DDE3F0}.ex .tile.o{background:#FFE27A}.ex .tile.p{background:#BFEFFF}
.ex .cv{background:#D4F25F;border-radius:10px 40px 40px 40px}
.ex .rb{background:#FFFFFF;border-radius:40px}
.ex .st em{color:#1B1035;font-weight:700}
.ex .bar{background:#1B1035}
.ex .bar .b1{background:#D4F25F;color:#1B1035}
.ex .bar .b2{color:#FFFFFF}

/* B · Verre : le fond est le ciel de ta météo intérieure, les panneaux flottent dessus */
.g{color:#FFFFFF;background:
  radial-gradient(120% 70% at 100% 0%,rgba(240,96,168,1) 0%,transparent 58%),
  radial-gradient(90% 60% at 0% 48%,rgba(244,150,70,1) 0%,transparent 58%),
  radial-gradient(120% 80% at 70% 100%,rgba(30,180,190,1) 0%,transparent 60%),#33248F}
.g .date{color:rgba(255,255,255,.9)}
.g .sv,.g .tile,.g .cv,.g .rb{background:rgba(28,16,84,.2);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);
  border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(0,0,0,.28),0 12px 28px rgba(10,5,40,.3)}
.g .sv,.g .cv,.g .rb{border-radius:30px}
.g .tile{border-radius:24px}
.g .sv .k,.g .tile i,.g .lab{color:rgba(255,255,255,.86)}
.g .gl{filter:drop-shadow(0 0 9px rgba(255,255,255,.5))}
.g .bar{background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 12px 28px rgba(10,5,40,.35)}
.g .bar .b1{background:#FFFFFF;color:#2A1B7A}
.g .bar .b2{color:#FFFFFF}

/* C · Fiche de perso : une interface de jeu, coins coupés, jauges, deux couleurs de signal */
.r{background:#0B1F2A;color:#E8F4F2}
.r .date{color:#9FC2C4}
.r .hi{text-transform:uppercase;letter-spacing:.01em}
.r .sv,.r .tile,.r .cv,.r .rb,.r .bar,.r .bar span{border-radius:0;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.r .sv{background:#FFC857;color:#1A1300}
.r .tile,.r .cv,.r .rb{background:#12303F}
.r .tile i,.r .lab{color:#6EE7C8}
.r .cvin svg{color:#6EE7C8}
.r .st li{grid-template-columns:minmax(0,1fr) auto 34px}
.r .st u{display:block;grid-column:1 / -1;height:6px;background:linear-gradient(90deg,#6EE7C8 calc(var(--v)*10%),#1F4658 0)}
.r .st em{color:#FFC857;font-weight:700}
.r .yc .l{color:#9FC2C4}
.r .bar{background:#12303F}
.r .bar .b1{background:#6EE7C8;color:#06231C}
.r .bar .b2{color:#E8F4F2}

/* D · Le ciel et le verre de B, la fiche de jeu de C */
.d .hi{text-transform:uppercase;letter-spacing:.01em}
.d .sv{background:rgba(255,200,87,.93);color:#1A1300;border-color:rgba(255,255,255,.55)}
.d .sv .k{color:#3A2B00}
.d .sv,.d .cv,.d .rb{border-radius:20px}
.d .tile{border-radius:16px}
.d .lab,.d .tile i{color:#8FF5DA}
.d .cvin svg{color:#8FF5DA}
.d .st u{display:block;grid-column:1 / -1;height:6px;border-radius:3px;background:linear-gradient(90deg,#8FF5DA calc(var(--v)*10%),rgba(255,255,255,.24) 0)}
.d .st em{color:#FFD27A;font-weight:700}
.d .bar{border-radius:22px}
.d .bar span{border-radius:14px}
.d .bar .b1{background:#8FF5DA;color:#06231C}

/* E · Le verre et les arrondis de B, dans les verts de C */
.e{background:
  radial-gradient(120% 70% at 100% 0%,rgba(46,170,140,.95) 0%,transparent 58%),
  radial-gradient(90% 60% at 0% 48%,rgba(205,150,55,.7) 0%,transparent 56%),
  radial-gradient(120% 80% at 70% 100%,rgba(22,128,150,.95) 0%,transparent 60%),#0B2A33}
.e .sv,.e .tile,.e .cv,.e .rb{background:rgba(4,28,34,.32)}
.e .lab,.e .tile i,.e .sv .k{color:#9CF6DE}
.e .cvin svg{color:#9CF6DE}
.e .st em{color:#FFD27A;font-weight:700}
.e .bar .b1{background:#6EE7C8;color:#06231C}
</style>

<div class="wrap">
  <h1>B, C, et le mélange demandé</h1>
  <p class="intro">Le même écran, les mêmes données. Rien n’est cliquable : c’est une planche pour choisir.</p>
  <div class="board" id="board"></div>
</div>

<script>
(function(){
  var DIRS = [
    ["ex","A · Expressif","Aplats francs, formes qui varient d’un bloc à l’autre, chiffres énormes. L’esprit Material 3 Expressive."],
    ["g","B · Verre","Le fond est le ciel de ta météo du mois, les panneaux flottent dessus. L’esprit Liquid Glass."],
    ["r","C · Fiche de perso","Une interface de jeu : coins coupés, jauges, deux couleurs de signal. Tes stats de RPG, assumées."],
    ["g d","D · B et C ensemble","Le ciel et le verre de B, avec les jauges, les majuscules et les couleurs de signal de C."],
    ["g e","E · Verre vert","Le verre, les tuiles et les boutons arrondis de B, dans les verts de C : fond sarcelle, menthe et ambre."]
  ];
  DIRS = DIRS.filter(function(d){ return /^(g|r|g e)$/.test(d[0]); });
  var YRS = [["’19","a c"],["’20","a a"],["’21","a o"],["’22","b a"],["’23","a"],["’24","o"],["’25","c o"],["’26","b p"]];
  var VIT = [["b",5,"Bronze"],["a",10,"Argent"],["o",5,"Or"],["p",1,"Platine"]];
  var ST = [["Proches",8,"▲ +1"],["Amour",6,"▲ +2"],["Santé",7,"▲ +1"],["Argent",5,"="]];
  function m(k,x){ return '<span class="gl"><span class="med '+k+(x?' '+x:'')+'"></span></span>'; }
  var radar = '<svg viewBox="-74 -74 148 148" aria-hidden="true">'
    + '<polygon class="rg" points="0,-70 49.5,-49.5 70,0 49.5,49.5 0,70 -49.5,49.5 -70,0 -49.5,-49.5"/>'
    + '<polygon class="rg" points="0,-35 24.7,-24.7 35,0 24.7,24.7 0,35 -24.7,24.7 -35,0 -24.7,-24.7"/>'
    + '<polygon class="rp" points="0,-42 39.6,-39.6 35,0 19.8,19.8 0,49 -29.7,29.7 -49,0 -29.7,-29.7"/>'
    + '<polygon class="rn" points="0,-49 39.6,-39.6 35,0 29.7,29.7 0,56 -29.7,29.7 -49,0 -34.6,-34.6"/></svg>';
  var $board = document.getElementById("board");
  $board.innerHTML = DIRS.map(function(d){
    return '<section class="col"><h2>'+d[1]+'</h2><p class="why">'+d[2]+'</p><div class="ph '+d[0]+'"><div class="scr">'
      + '<div><p class="date">Samedi 3 octobre</p><h3 class="hi">Bonjour Léa</h3></div>'
      + '<div class="sv">'+m("o","big")+'<div><p class="k">Il y a 2 ans aujourd’hui</p><p class="t">Mon premier semi-marathon, à Lyon</p><p class="q">« Maman m’attendait à l’arrivée. 2 h 07. »</p></div></div>'
      + '<div class="vt">'+VIT.map(function(v){ return '<div class="tile '+v[0]+'">'+m(v[0])+'<b>'+v[1]+'</b><i>'+v[2]+'</i></div>'; }).join("")+'</div>'
      + '<div class="cv"><p class="lab">Carte de vie</p><div class="cvin">'+radar+'<ul class="st">'+ST.map(function(s){ return '<li><span>'+s[0]+'</span><b>'+s[1]+'</b><em>'+s[2]+'</em><u style="--v:'+s[1]+'"></u></li>'; }).join("")+'</ul></div></div>'
      + '<div class="rb"><p class="lab">Ta vie d’un coup d’œil</p><div class="yrs">'+YRS.map(function(y){ return '<div class="yc">'+y[1].split(" ").map(function(k){ return m(k,"dot"); }).join("")+'<span class="l">'+y[0]+'</span></div>'; }).join("")+'</div></div>'
      + '</div><div class="bar"><span class="b2">Faire le point</span><span class="b1">+ Ajouter</span></div></div></section>';
  }).join("");
})();
</script>
